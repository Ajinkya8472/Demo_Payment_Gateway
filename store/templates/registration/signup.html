{% extends 'store/base.html' %}
{% block title %}Sign up | Reelkit{% endblock %}
{% block content %}
<h1 class="font-display font-bold text-3xl tracking-tight mb-6">Create your account</h1>
<div class="max-w-sm">
  <form method="post" class="space-y-4">{% csrf_token %}
    {{ form.as_p }}
    <button class="bg-cobalt text-white font-bold px-6 py-3 rounded-md hover:bg-ink transition-colors">Create account</button>
  </form>
  <p class="mt-4 text-sm">Already have an account? <a href="{% url 'login' %}" class="text-cobalt underline">Log in</a>.</p>
</div>
{% endblock %}
